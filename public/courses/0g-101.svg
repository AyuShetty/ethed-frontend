<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="zeroGGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#zeroGGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#ffffff" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#ffffff" opacity="0.05"/>
  
  <!-- AI/Network icon - connected nodes -->
  <g transform="translate(80, 100)">
    <!-- Central node -->
    <circle cx="100" cy="100" r="35" fill="#6ee7b7" stroke="#ffffff" stroke-width="4"/>
    <!-- Surrounding nodes -->
    <circle cx="50" cy="50" r="25" fill="#a7f3d0" stroke="#ffffff" stroke-width="3"/>
    <circle cx="150" cy="50" r="25" fill="#a7f3d0" stroke="#ffffff" stroke-width="3"/>
    <circle cx="30" cy="120" r="25" fill="#a7f3d0" stroke="#ffffff" stroke-width="3"/>
    <circle cx="170" cy="120" r="25" fill="#a7f3d0" stroke="#ffffff" stroke-width="3"/>
    <!-- Connection lines -->
    <line x1="100" y1="100" x2="50" y2="50" stroke="#ffffff" stroke-width="3"/>
    <line x1="100" y1="100" x2="150" y2="50" stroke="#ffffff" stroke-width="3"/>
    <line x1="100" y1="100" x2="30" y2="120" stroke="#ffffff" stroke-width="3"/>
    <line x1="100" y1="100" x2="170" y2="120" stroke="#ffffff" stroke-width="3"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="200" font-size="72" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">0G 101</text>
  <text x="400" y="280" font-size="36" fill="#d1fae5" font-family="Arial, sans-serif" opacity="0.9">AI-Native Stack</text>
  
  <!-- Subtitle -->
  <text x="400" y="380" font-size="24" fill="#ffffff" font-family="Arial, sans-serif" opacity="0.8">Build next-generation decentralized AI</text>
  
  <!-- Badge -->
  <rect x="400" y="430" width="360" height="60" rx="30" fill="#6ee7b7" opacity="0.2" stroke="#6ee7b7" stroke-width="2"/>
  <text x="580" y="470" font-size="20" fill="#6ee7b7" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">ADVANCED • 4 WEEKS • NEW</text>
</svg>