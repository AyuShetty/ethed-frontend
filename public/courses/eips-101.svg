<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="eipsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#eipsGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="150" fill="#ffffff" opacity="0.1"/>
  <circle cx="50" cy="530" r="200" fill="#ffffff" opacity="0.05"/>
  
  <!-- Document/Protocol icon with nested boxes -->
  <g transform="translate(100, 120)">
    <!-- Outer box -->
    <rect x="20" y="20" width="160" height="200" fill="none" stroke="#ffffff" stroke-width="8" rx="10"/>
    <!-- Inner box 1 -->
    <rect x="40" y="50" width="120" height="30" fill="none" stroke="#fbbf24" stroke-width="6" rx="5"/>
    <!-- Inner box 2 -->
    <rect x="40" y="100" width="120" height="30" fill="none" stroke="#fbbf24" stroke-width="6" rx="5"/>
    <!-- Inner box 3 -->
    <rect x="40" y="150" width="120" height="30" fill="none" stroke="#fbbf24" stroke-width="6" rx="5"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="200" font-size="72" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">EIPs 101</text>
  <text x="400" y="280" font-size="36" fill="#fef3c7" font-family="Arial, sans-serif" opacity="0.9">Ethereum Improvement Proposals</text>
  
  <!-- Subtitle -->
  <text x="400" y="380" font-size="24" fill="#ffffff" font-family="Arial, sans-serif" opacity="0.8">Learn governance and protocol evolution</text>
  
  <!-- Badge -->
  <rect x="400" y="430" width="380" height="60" rx="30" fill="#fbbf24" opacity="0.2" stroke="#fbbf24" stroke-width="2"/>
  <text x="590" y="470" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">INTERMEDIATE • 3 WEEKS • NEW</text>
</svg>