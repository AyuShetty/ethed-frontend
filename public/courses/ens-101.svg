<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="ensGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ensAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ensGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#ffffff" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#ffffff" opacity="0.05"/>
  
  <!-- Domain icon -->
  <g transform="translate(100, 150)">
    <!-- @ symbol as domain -->
    <circle cx="100" cy="100" r="80" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="100" cy="100" r="45" fill="none" stroke="#ffffff" stroke-width="8"/>
    <text x="100" y="110" font-size="60" font-weight="bold" text-anchor="middle" fill="#22d3ee">@</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="200" font-size="72" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">ENS 101</text>
  <text x="400" y="280" font-size="36" fill="#e0f2fe" font-family="Arial, sans-serif" opacity="0.9">Ethereum Name Service</text>
  
  <!-- Subtitle -->
  <text x="400" y="380" font-size="24" fill="#ffffff" font-family="Arial, sans-serif" opacity="0.8">Master decentralized identities</text>
  
  <!-- Badge -->
  <rect x="400" y="430" width="280" height="60" rx="30" fill="#22d3ee" opacity="0.2" stroke="#22d3ee" stroke-width="2"/>
  <text x="540" y="470" font-size="20" fill="#22d3ee" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">BEGINNER • 2 WEEKS</text>
</svg>